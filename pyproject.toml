[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trqm"
version = "0.1.0"
description = "TRQM — Trust, Relevance, Quality, Metadata pipeline for organisational knowledge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "google-genai>=1.0.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[project.scripts]
trqm = "trqm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
